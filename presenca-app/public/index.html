<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Proteção extra contra código injetado: só carrega scripts desta app e só fala
       com o OpenStreetMap (procura de endereços) e o Google Apps Script do usuário (cópias). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://nominatim.openstreetmap.org https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
  <meta name="theme-color" content="#1f6feb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Onsitely</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="28" height="28" /> Onsitely</div>
    <select id="semester-select" data-i18n-aria="ui.period"></select>
  </header>

  <nav class="tabs" role="tablist">
    <a href="#painel" data-tab="painel" data-i18n="tab.dashboard"></a>
    <a href="#calendario" data-tab="calendario" data-i18n="tab.calendar"></a>
    <a href="#planejamento" data-tab="planejamento" data-i18n="tab.planning"></a>
    <a href="#config" data-tab="config" data-i18n="tab.settings"></a>
  </nav>

  <main>
    <!-- LOGIN (só no modo servidor) -->
    <section id="login" hidden>
      <div class="card narrow">
        <h2 data-i18n="login.title"></h2>
        <form id="login-form">
          <label><span data-i18n="login.password"></span> <input type="password" name="password" autocomplete="current-password" required /></label>
          <button class="primary" data-i18n="login.submit"></button>
          <p class="error" id="login-error"></p>
        </form>
      </div>
    </section>

    <!-- PAINEL -->
    <section id="painel" class="tab" hidden>
      <div class="card today" id="today-card"></div>
      <div class="card" id="backup-due" hidden></div>
      <div class="card stats-ask" id="stats-ask" hidden>
        <h3 data-i18n="stats.title"></h3>
        <p data-i18n="stats.question"></p>
        <p class="hint" data-i18n="stats.what"></p>
        <div class="row"><button type="button" class="primary" data-stats="yes" data-i18n="stats.yes"></button><button type="button" data-stats="no" data-i18n="stats.no"></button></div>
      </div>
      <div class="card" id="semester-card"></div>
      <div class="card"><h3 data-i18n="dash.alerts"></h3><ul class="alerts" id="alerts"></ul></div>
      <div class="card"><h3 data-i18n="dash.months"></h3><div class="table-wrap"><table id="months-table"></table></div></div>
    </section>

    <!-- CALENDÁRIO -->
    <section id="calendario" class="tab" hidden>
      <div class="card">
        <div class="legend">
          <span class="chip office" data-i18n="status.office"></span><span class="chip home" data-i18n="status.home"></span>
          <span class="chip absence" data-i18n="status.absence"></span><span class="chip holiday" data-i18n="cal.holiday"></span>
          <span class="chip pending" data-i18n="cal.pending"></span><span class="chip planned" data-i18n="cal.planned"></span><span class="chip trip" data-i18n="cal.trip"></span>
        </div>
        <p class="hint" data-i18n="cal.hint"></p>
      </div>
      <div id="calendar"></div>
      <div class="card"><h3 data-i18n="cal.holidaysTitle"></h3><p class="hint" data-i18n="cal.holidaysHint"></p><ul id="holiday-list" class="list"></ul></div>
    </section>

    <!-- PLANEJAMENTO -->
    <section id="planejamento" class="tab" hidden>
      <div class="card plan-sticky" id="plan-bar"></div>
      <div class="card">
        <div id="plan-detail"></div>
        <h3 style="margin-top:14px" data-i18n="plan.weeks"></h3>
        <p class="hint" id="plan-hint"></p>
        <div id="plan-actions"></div>
        <div id="weeks"></div>
      </div>
      <div class="card" id="trips-card">
        <h3 data-i18n="trip.title"></h3>
        <p class="hint" data-i18n="trip.hint"></p>
        <ul id="trips" class="list"></ul>
        <form id="trip-form" class="grid-trip">
          <label><span data-i18n="trip.office"></span> <select name="officeId" required></select></label>
          <label><span data-i18n="ui.from"></span> <input type="date" name="start" required /></label>
          <label><span data-i18n="ui.to"></span> <input type="date" name="end" required /></label>
          <label><span data-i18n="ui.note"></span> <input type="text" name="note" data-i18n-ph="ui.optional" /></label>
          <button class="primary" data-i18n="trip.add"></button>
        </form>
      </div>
      <div class="card" id="absences-card">
        <h3 data-i18n="abs.title"></h3>
        <p class="hint" data-i18n-html="abs.hint"></p>
        <ul id="absences" class="list"></ul>
        <div class="row"><button type="button" id="absence-add" class="primary" data-i18n="abs.add"></button></div>
      </div>
    </section>

    <!-- AJUSTES -->
    <section id="config" class="tab" hidden>
      <form id="settings-form">
        <div class="card">
          <h3 data-i18n="set.language"></h3>
          <select name="locale" id="locale-select"></select>
        </div>

        <div class="card">
          <h3 data-i18n="rule.title"></h3>
          <label><span data-i18n="rule.template"></span> <select id="rule-template"></select></label>
          <div class="grid2">
            <label><span data-i18n="rule.target"></span>
              <select name="target">
                <option value="percent" data-i18n="rule.target.percent"></option>
                <option value="daysPerWeek" data-i18n="rule.target.daysPerWeek"></option>
                <option value="daysPerMonth" data-i18n="rule.target.daysPerMonth"></option>
              </select>
            </label>
            <label class="rule-val" data-for="percent"><span data-i18n="rule.pct"></span> <input type="number" name="officePct" min="0" max="100" /></label>
            <label class="rule-val" data-for="daysPerWeek"><span data-i18n="rule.daysPerWeek"></span> <input type="number" name="daysPerWeek" min="1" max="7" /></label>
            <label class="rule-val" data-for="daysPerMonth"><span data-i18n="rule.daysPerMonth"></span> <input type="number" name="daysPerMonth" min="1" max="31" /></label>
          </div>
          <label><span data-i18n="rule.period"></span>
            <select name="period">
              <option value="month" data-i18n="periodKind.month"></option>
              <option value="quarter" data-i18n="periodKind.quarter"></option>
              <option value="semester" data-i18n="periodKind.semester"></option>
              <option value="year" data-i18n="periodKind.year"></option>
            </select>
          </label>
          <fieldset class="weekdays" id="fixed-days"><legend data-i18n="rule.fixedDays"></legend></fieldset>
          <fieldset class="weekdays" id="workdays"><legend data-i18n="rule.workdays"></legend></fieldset>
          <p class="hint" id="rule-summary"></p>
          <label><span data-i18n="rule.startDate"></span>
            <div class="row"><input type="date" name="startDate" /><button type="button" id="start-clear" data-i18n="rule.noDate"></button></div>
          </label>
          <p class="hint" data-i18n="rule.startHint"></p>
          <div class="rule-val" data-for="percent">
            <label class="check"><input type="checkbox" name="enforceHomeCap" /> <span data-i18n="rule.cap"></span></label>
            <label><span data-i18n="rule.capDays"></span> <input type="number" name="maxHomeDays" min="0" max="200" /></label>
            <p class="hint" data-i18n="rule.capHint"></p>
          </div>
        </div>

        <div class="card">
          <h3 data-i18n="share.title"></h3>
          <p class="hint" data-i18n="share.hint"></p>
          <label><span data-i18n="share.company"></span> <input type="text" name="companyName" maxlength="60" data-i18n-ph="share.companyPh" /></label>
          <div class="row"><button type="button" id="share-config" data-i18n="share.button"></button></div>
        </div>

        <div class="card">
          <h3 data-i18n="rem.title"></h3>
          <div class="local-only" hidden>
            <p class="hint" data-i18n-html="rem.localHint"></p>
            <p id="cal-info" class="hint"></p>
            <div class="row">
              <button type="button" id="cal-ics" class="primary" data-i18n="rem.ics"></button>
              <button type="button" id="cal-google" data-i18n="rem.google"></button>
            </div>
            <p class="hint" data-i18n="rem.icsHint"></p>
          </div>
          <p id="push-status" class="hint server-only"></p>
          <div class="row server-only">
            <button type="button" id="push-enable" class="primary"></button>
            <button type="button" id="push-test" data-i18n="rem.pushTest"></button>
          </div>
          <label class="check server-only"><input type="checkbox" name="reminderEnabled" /> <span data-i18n="rem.untilAnswer"></span></label>
          <div class="grid3">
            <label><span data-i18n="rem.first"></span> <span class="time-field" data-name="reminderTime"></span></label>
            <label><span data-i18n="rem.repeat"></span> <input type="number" name="repeatMinutes" min="5" required /></label>
            <label><span data-i18n="rem.until"></span> <span class="time-field" data-name="reminderUntil"></span></label>
          </div>
          <fieldset class="weekdays" id="reminder-days"><legend data-i18n="rem.days"></legend></fieldset>
          <label class="check server-only"><input type="checkbox" name="weekly" /> <span data-i18n="rem.weekly"></span></label>
          <label class="check server-only"><input type="checkbox" name="monthly" /> <span data-i18n="rem.monthly"></span></label>
        </div>

        <div class="card">
          <h3 data-i18n="off.title"></h3>
          <p class="hint" data-i18n-html="off.hint"></p>
          <ul id="offices" class="list"></ul>
          <div class="row"><button type="button" id="office-add" data-i18n="off.add"></button></div>
        </div>

        <div class="card">
          <h3 data-i18n="loc.title"></h3>
          <p class="hint" data-i18n-html="loc.hint"></p>
          <label class="check"><input type="checkbox" name="locationEnabled" /> <span data-i18n="loc.enable"></span></label>
          <div class="grid2">
            <label><span data-i18n="loc.start"></span> <span class="time-field" data-name="windowStart"></span></label>
            <label><span data-i18n="loc.end"></span> <span class="time-field" data-name="windowEnd"></span></label>
          </div>
          <label class="check"><input type="checkbox" name="askOnTimezoneChange" /> <span data-i18n="loc.askTz"></span></label>
        </div>

        <div class="card local-only" hidden>
          <h3 data-i18n="bk.title"></h3>
          <p class="hint" data-i18n-html="bk.hint"></p>
          <label><span data-i18n="bk.freq"></span>
            <select name="backupFrequency">
              <option value="weekly" data-i18n="bk.weekly"></option>
              <option value="monthly" data-i18n="bk.monthly"></option>
              <option value="off" data-i18n="bk.off"></option>
            </select>
          </label>
          <p id="backup-info" class="hint"></p>
          <div class="row">
            <button type="button" id="backup-export" class="primary" data-i18n="bk.sendNow"></button>
            <label class="button" style="margin:0"><span data-i18n="bk.restore"></span><input type="file" id="backup-import" accept="application/json,.json" hidden /></label>
          </div>
          <p class="hint" data-i18n-html="bk.shareHint"></p>
          <h4 data-i18n="bk.autoTitle"></h4>
          <p class="hint"><span data-i18n-html="bk.autoHint"></span> <a href="https://github.com/CabralFM/Office-Presence-Management-App/blob/master/presenca-app/integrations/google-backup.md" target="_blank" rel="noopener" data-i18n="bk.howTo"></a></p>
          <label><span data-i18n="bk.url"></span> <input type="url" name="backupUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" /></label>
          <label><span data-i18n="bk.token"></span> <input type="password" name="backupToken" autocomplete="off" /></label>
          <label class="check"><input type="checkbox" name="backupEmail" /> <span data-i18n="bk.email"></span></label>
          <div class="row"><button type="button" id="backup-auto-now" data-i18n="bk.autoNow"></button></div>
          <p id="backup-auto-info" class="hint"></p>
        </div>

        <div class="card">
          <h3 data-i18n="about.title"></h3>
          <div class="row">
            <button type="button" id="about-open" data-i18n="about.open"></button>
            <button type="button" id="wizard-open" data-i18n="wiz.reopen"></button>
          </div>
          <div id="stats-settings" hidden>
            <label class="check"><input type="checkbox" id="stats-toggle" /> <span data-i18n="stats.toggle"></span></label>
            <p class="hint" data-i18n="stats.what"></p>
            <p class="hint" id="stats-info"></p>
          </div>
        </div>

        <div class="card row sticky-actions">
          <button class="primary" data-i18n="set.save"></button>
          <button type="button" id="export-csv" data-i18n="set.csv"></button>
          <button type="button" id="logout" hidden data-i18n="set.logout"></button>
        </div>
      </form>
    </section>
    <p class="footer"><a href="#" id="footer-about" data-i18n="about.footer"></a></p>
  </main>

  <!-- Janelas (diálogos) -->
  <dialog id="day-dialog">
    <form method="dialog">
      <h3 id="dd-title"></h3>
      <p id="dd-sub" class="hint"></p>
      <div class="choice" id="dd-buttons"></div>
      <label id="dd-office-wrap" hidden><span data-i18n="day.officeIf"></span> <select id="dd-office"></select></label>
      <label><span data-i18n="ui.note"></span> <input type="text" id="dd-note" data-i18n-ph="ui.optional" /></label>
      <div class="row end"><button value="cancel" data-i18n="ui.close"></button></div>
    </form>
  </dialog>

  <dialog id="geo-dialog">
    <form method="dialog">
      <h3 id="geo-title"></h3>
      <p id="geo-text"></p>
      <div class="choice" id="geo-buttons"></div>
      <div class="row end"><button value="cancel" data-i18n="ui.notNow"></button></div>
    </form>
  </dialog>

  <dialog id="absence-dialog">
    <form id="absence-form" method="dialog">
      <h3 id="ab-title"></h3>
      <fieldset id="ab-types" class="types"></fieldset>
      <div class="grid2">
        <label><span data-i18n="ui.from"></span> <input type="date" name="start" required /></label>
        <label><span data-i18n="ui.toIncl"></span> <input type="date" name="end" required /></label>
      </div>
      <p class="hint" data-i18n="abs.onlyWorkdays"></p>
      <label><span id="ab-just-label"></span>
        <textarea name="justification" rows="3" maxlength="500"></textarea>
      </label>
      <p id="ab-hint" class="hint"></p>
      <p id="ab-error" class="error"></p>
      <div class="row end"><button value="cancel" formnovalidate data-i18n="ui.cancel"></button><button type="button" id="ab-save" class="primary" data-i18n="ui.save"></button></div>
    </form>
  </dialog>

  <dialog id="office-dialog">
    <form id="office-form" method="dialog">
      <h3 id="of-title"></h3>
      <label><span data-i18n="of.name"></span> <input name="name" required maxlength="60" data-i18n-ph="of.namePh" /></label>
      <div class="grid2">
        <label><span data-i18n="of.country"></span> <select name="country"></select></label>
        <label><span data-i18n="of.region"></span> <select name="region"></select></label>
      </div>
      <label><span data-i18n="of.timezone"></span> <select name="timezone"></select></label>
      <label><span data-i18n="of.address"></span>
        <div class="row"><input type="text" name="address" data-i18n-ph="of.addressPh" /><button type="button" id="of-geocode" data-i18n="of.search"></button></div>
      </label>
      <p class="hint osm" data-i18n-html="of.osm"></p>
      <div class="row"><button type="button" id="of-here" data-i18n="of.here"></button></div>
      <p id="of-loc" class="hint"></p>
      <label><span data-i18n="of.radius"></span> <input type="number" name="radiusM" min="50" max="5000" /></label>
      <fieldset id="of-optional"></fieldset>
      <h4 data-i18n="of.cityTitle"></h4>
      <label id="of-city-wrap"><span data-i18n="of.city"></span> <select id="of-city"></select></label>
      <p id="of-city-hint" class="hint"></p>
      <h4 data-i18n="of.otherTitle"></h4>
      <p class="hint" data-i18n="of.otherHint"></p>
      <ul id="of-custom" class="list"></ul>
      <div class="row add-holiday">
        <input type="text" id="of-ch-date" data-i18n-ph="of.datePh" />
        <input type="text" id="of-ch-name" data-i18n-ph="of.name" />
        <select id="of-ch-scope"><option value="municipal" data-i18n="scope.municipal"></option><option value="estadual" data-i18n="scope.estadual"></option><option value="empresa" data-i18n="scope.empresa"></option></select>
        <button type="button" id="of-ch-add" data-i18n="ui.add"></button>
      </div>
      <details id="of-all-holidays" class="holiday-preview"><summary></summary><ul class="list"></ul></details>
      <label class="check"><input type="checkbox" name="primary" /> <span data-i18n="of.primary"></span></label>
      <div class="row end"><button value="cancel" formnovalidate data-i18n="ui.cancel"></button><button type="button" id="of-save" class="primary" data-i18n="of.save"></button></div>
    </form>
  </dialog>

  <!-- Assistente da primeira utilização -->
  <dialog id="wizard">
    <form id="wizard-form" method="dialog">
      <div class="wiz-step" data-step="1">
        <h3 data-i18n="wiz.welcome"></h3>
        <p class="hint" data-i18n="wiz.intro"></p>
        <label><span data-i18n="set.language"></span> <select name="locale" id="wiz-locale"></select></label>
        <label><span data-i18n="of.country"></span> <select name="country"></select></label>
        <label id="wiz-city-wrap"><span data-i18n="of.city"></span> <select name="city"></select></label>
        <label id="wiz-region-wrap"><span data-i18n="of.region"></span> <select name="region"></select></label>
      </div>
      <div class="wiz-step" data-step="2" hidden>
        <h3 data-i18n="wiz.ruleTitle"></h3>
        <p class="hint" data-i18n="wiz.ruleHint"></p>
        <div id="wiz-templates" class="templates"></div>
        <label><span data-i18n="rule.startDate"></span> <input type="date" name="startDate" /></label>
        <p class="hint" data-i18n="wiz.startHint"></p>
      </div>
      <div class="wiz-step" data-step="3" hidden>
        <h3 data-i18n="wiz.doneTitle"></h3>
        <p id="wiz-summary"></p>
        <ul class="wiz-tips">
          <li data-i18n="wiz.tip1"></li>
          <li data-i18n="wiz.tip2"></li>
          <li data-i18n="wiz.tip3"></li>
        </ul>
        <fieldset id="wiz-stats" class="wiz-stats" hidden>
          <legend data-i18n="stats.title"></legend>
          <p data-i18n="stats.question"></p>
          <p class="hint" data-i18n="stats.what"></p>
          <label><input type="radio" name="stats" value="yes" /> <span data-i18n="stats.yes"></span></label>
          <label><input type="radio" name="stats" value="no" /> <span data-i18n="stats.no"></span></label>
        </fieldset>
        <p class="hint" data-i18n="about.disclaimer"></p>
      </div>
      <div class="row end">
        <button type="button" id="wiz-skip" data-i18n="wiz.skip"></button>
        <button type="button" id="wiz-back" data-i18n="wiz.back"></button>
        <button type="button" id="wiz-next" class="primary" data-i18n="wiz.next"></button>
      </div>
    </form>
  </dialog>

  <!-- Aplicar configuração recebida por link -->
  <dialog id="cfg-dialog">
    <form method="dialog">
      <h3 data-i18n="share.applyTitle"></h3>
      <p id="cfg-text"></p>
      <p class="hint" data-i18n="share.applyHint"></p>
      <div class="row end"><button value="cancel" data-i18n="ui.cancel"></button><button type="button" id="cfg-apply" class="primary" data-i18n="share.apply"></button></div>
    </form>
  </dialog>

  <!-- Sobre, privacidade e créditos -->
  <dialog id="about-dialog">
    <form method="dialog">
      <h3 data-i18n="about.title"></h3>
      <p id="about-version" class="hint"></p>
      <h4 data-i18n="about.privacyTitle"></h4>
      <p data-i18n-html="about.privacy"></p>
      <p id="about-stats" data-i18n-html="about.privacyStats" hidden></p>
      <h4 data-i18n="about.disclaimerTitle"></h4>
      <p data-i18n="about.disclaimer"></p>
      <h4 data-i18n="about.creditsTitle"></h4>
      <ul class="credits">
        <li data-i18n-html="about.creditOsm"></li>
        <li data-i18n-html="about.creditHolidays"></li>
      </ul>
      <h4 data-i18n="about.newsTitle"></h4>
      <ul id="about-news" class="credits"></ul>
      <div class="row end"><button value="cancel" data-i18n="ui.close"></button></div>
    </form>
  </dialog>

  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
